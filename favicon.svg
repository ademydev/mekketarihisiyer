<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mekke’nin Tarihî Önemi">
  <title>Mekke’nin Tarihî Önemi</title>

  <defs>
    <linearGradient id="kaabaBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46301d"/>
      <stop offset="1" stop-color="#241809"/>
    </linearGradient>
  </defs>

  <!-- Tam dolu krem zemin (kırpma/şeffaflık sorunu olmaması için) -->
  <rect x="0" y="0" width="64" height="64" fill="#f7f3ea"/>

  <!-- İç altın çerçeve -->
  <rect x="2.4" y="2.4" width="59.2" height="59.2" rx="11" fill="none" stroke="#b0812e" stroke-width="1.6"/>

  <!-- Kâbe gövdesi -->
  <rect x="18" y="20" width="28" height="28" rx="1.5" fill="url(#kaabaBody)"/>
  <!-- Çatı gölgesi -->
  <rect x="18" y="20" width="28" height="3.2" rx="1.5" fill="#0f0a05" opacity="0.5"/>
  <!-- Altın kuşak (kisve) -->
  <rect x="18" y="26" width="28" height="4.6" fill="#b0812e"/>
  <!-- Kapı -->
  <rect x="28.8" y="36.6" width="6.4" height="11.4" rx="0.8" fill="#b0812e"/>

  <!-- Zemin şeridi (bordo) -->
  <rect x="13" y="49.5" width="38" height="2.8" rx="1.4" fill="#6b2430"/>
</svg>
